title: "5-base/TAPS QC Summary Report"
intro_text: "This report has been generated by the <strong>JAX-GT 5base/TAPS</strong> Nextflow DSL2 pipeline. For information about how to interpret these results, please see the <a href='https://github.com/TheJacksonLaboratory/5baseTAPS/blob/main/docs/interpret_multiqc.md' target='_blank'>MultiQC interpretation guide</a> or the <a href='https://github.com/TheJacksonLaboratory/5baseTAPS' target='_blank'>full pipeline documentation</a>."

custom_logo: "./JAX_logo_rgb_transparentback.png"
custom_logo_url: "https://www.jax.org"
custom_logo_title: "The Jackson Laboratory - Genome Technologies"

report_section_order:
  # ── Sections pinned just below General Statistics (highest = first) ──────────
  mapping_summary:
    order: 900
  duplex_summary:
    order: 800
  duplex_familysize:
    order: 700
  methyl_summary:
    order: 600
  # ── nf-core boilerplate pushed to the bottom ─────────────────────────────────
  "jax-gt-5basetaps-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "TheJacksonLaboratory-5baseTAPS-summary":
    order: -1002

export_plots: true
disable_version_detection: true

# Exclude DRAGEN module — it picks up legacy DRAGEN-format CSV files
# from old pipeline runs. Our custom_content sections cover these metrics.
exclude_modules:
  - dragen

# Ignore the MultiQC output directory itself — it contains data files from
# the previous run that would be re-parsed and create duplicate sections.
fn_ignore_dirs:
  - "report"
  - "multiQC"
  - "multiqc_report_data"
  - "multiqc_report_plots"

# ── Sample name cleaning ──────────────────────────────────────────────────────
# Strip suffixes so all files from the same biological sample map to one row
# in General Statistics. Order matters — longest/most-specific first.
extra_fn_clean_exts:
  # Pipeline stage suffixes on flagstat files
  - ".prededup"
  - ".postdedup"
  - ".lambda_negCtrl"
  - ".puc19_posCtrl"
  # GATK output suffixes
  - ".haplotypecaller.filtered-SNP"
  - ".haplotypecaller.filtered-INDEL"
  - ".haplotypecaller"
  # FastQC R1/R2 — merges paired-end rows into one sample
  - "_1"
  - "_2"
  # GATK VariantFiltration output suffix — bcftools stats reads the VCF
  # filename from the ID line (e.g. "1Mreads.filtered.vcf.gz"), producing
  # "1Mreads.filtered" after .vcf.gz is stripped. This cleans it to "1Mreads"
  # so the bcftools row merges with the mosdepth/flagstat row in General Stats.
  - ".filtered"
  # samtools stats output suffix — strip so "sample.cons.stats" → "sample"
  - ".cons"
  # Custom _mqc.tsv section suffixes
  - "_read_partitioning_mqc"
  - "_mapping_summary_mqc"
  - "_methyl_controls_mqc"
  - "_methyl_summary_mqc"
  - "_duplex_summary_mqc"
  - "_duplex_familysize_mqc"
  - "_coverage_metrics_mqc"
  - "_variant_calling_mqc"

# ── General Statistics table: column order and visibility ────────────────────
# Group order: FastQC → Samtools flagstat → Mosdepth → Bcftools stats
# NB: MultiQC 1.35 table_columns_visible/_name/_placement use table_object.py
#     _ns_match (namespace string) and _col_match (clean_rid). Use
#     general_stats_table (= pconfig.id) with full clean_rid inner keys for
#     reliable matching; plain clean_rid strings work for name/placement.
table_columns_name:
  samtools_flagstat-mapped_passed_pct: "% Aligned"

table_columns_placement:
  general_stats_table:
    fastqc-total_sequences:                          100   # Seqs
    fastqc-avg_sequence_length:                      110   # Avg Len
    fastqc-percent_gc:                               120   # GC
    samtools_flagstat-mapped_passed_pct:             130   # % Aligned
    mosdepth-mean_coverage:                          300
    mosdepth-median_coverage:                        310
    mosdepth-max_coverage:                           320
    mosdepth-10_x_pc:                                330   # >= 10x
    mosdepth-30_x_pc:                                340   # >= 30x
    bcftools_stats-number_of_records:                400
    bcftools_stats-number_of_SNPs:                   410
    bcftools_stats-number_of_indels:                 420
    bcftools_stats-tstv:                             430
    bcftools_stats-number_of_MNPs:                   440
    bcftools_stats-number_of_multiallelic_sites:     450
    bcftools_stats-number_of_multiallelic_SNP_sites: 460

table_columns_visible:
  fastqc:
    total_sequences:          True
    avg_sequence_length:      True
    percent_gc:               True
    percent_duplicates:       False
    median_sequence_length:   False
    percent_fails:            False
  general_stats_table:
    samtools_flagstat-mapped_passed_pct:             True
    samtools_flagstat-flagstat_total:                False
    samtools_flagstat-mapped_passed:                 False
    # samtools_stats columns — all hidden; insert size appears as a plot
    samtools_stats-error_rate:                       False
    samtools_stats-non_primary_alignments:           False
    samtools_stats-reads_mapped:                     False
    samtools_stats-reads_mapped_percent:             False
    samtools_stats-reads_mapped_and_paired_percent:  False
    samtools_stats-reads_unmapped_percent:           False
    samtools_stats-reads_properly_paired_percent:    False
    samtools_stats-reads_MQ0_percent:                False
    samtools_stats-raw_total_sequences:              False
    samtools_stats-insert_size_average:              False
  mosdepth:
    mean_coverage:            True
    median_coverage:          True
    min_coverage:             False
    max_coverage:             True
    1_x_pc:                   False
    5_x_pc:                   False
    10_x_pc:                  True
    30_x_pc:                  True
    50_x_pc:                  False
    coverage_bases:           False
    length:                   False
  bcftools_stats:
    number_of_records:                True
    number_of_SNPs:                   True
    number_of_indels:                 True
    tstv:                             True
    number_of_MNPs:                   True
    number_of_multiallelic_sites:     True
    number_of_multiallelic_SNP_sites: True

# ── Hide noisy files from ALL sections ───────────────────────────────────────
# Postdedup, lambda, and pUC19 flagstats are hidden; General Stats shows the
# prededup (post-merge, pre-dedup) flagstat as the primary read-count column.
# Lambda/pUC19 metrics are captured in the custom mapping/methyl sections.
fn_ignore_files:
  - "*.postdedup.flagstat"
  - "*.lambda_negCtrl.flagstat"
  - "*.puc19_posCtrl.flagstat"
