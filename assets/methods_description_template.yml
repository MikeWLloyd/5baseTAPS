## You inject any metadata in the Nextflow '${workflow}' object
data: |
  <h4>Methods</h4>
  <p>Data was processed using JAX-GT/5baseTAPS v${workflow.manifest.version} (5-base TAPS methylation and variant calling pipeline, The Jackson Laboratory Genome Technologies), utilising reproducible containerized software environments.</p>
  <p>The pipeline was executed with Nextflow v${workflow.nextflow.version} (<a href="https://doi.org/10.1038/nbt.3820">Di Tommaso <em>et al.</em>, 2017</a>) with the following command:</p>
  <pre><code>${workflow.commandLine}</code></pre>
  <p>UMI grouping and consensus read generation were performed with fgbio (<a href="https://doi.org/10.5281/zenodo.10456901">Homer <em>et al.</em>, 2024</a>). Cytosine methylation was called with rastair (<a href="https://doi.org/10.1101/2026.03.19.712983">Etzioni <em>et al.</em>, 2026</a>). Germline variant calling was performed with GATK HaplotypeCaller (<a href="https://doi.org/10.1101/gr.107524.110">McKenna <em>et al.</em>, 2010</a>).</p>
  <p>${tool_citations}</p>
  <h4>References</h4>
  <ul>
    <li>Di Tommaso, P., Chatzou, M., Floden, E. W., Barja, P. P., Palumbo, E., &amp; Notredame, C. (2017). Nextflow enables reproducible computational workflows. Nature Biotechnology, 35(4), 316-319. doi: <a href="https://doi.org/10.1038/nbt.3820">10.1038/nbt.3820</a></li>
    <li>Homer, N., Fennell, T., et al. (2024). fulcrumgenomics/fgbio (2.2.1). Zenodo. doi: <a href="https://doi.org/10.5281/zenodo.10456901">10.5281/zenodo.10456901</a></li>
    <li>Etzioni, S., et al. (2026). Rastair: reference-free alignment and methylation calling for TAPS sequencing. bioRxiv. doi: <a href="https://doi.org/10.1101/2026.03.19.712983">10.1101/2026.03.19.712983</a></li>
    <li>McKenna, A., Hanna, M., Banks, E., Sivachenko, A., Cibulskis, K., Kernytsky, A., Garimella, K., Altshuler, D., Gabriel, S., Daly, M., &amp; DePristo, M. A. (2010). The Genome Analysis Toolkit: A MapReduce framework for analyzing next-generation DNA sequencing data. Genome Research, 20(9), 1297-1303. doi: <a href="https://doi.org/10.1101/gr.107524.110">10.1101/gr.107524.110</a></li>
    <li>da Veiga Leprevost, F., Gruning, B. A., Alves Aflitos, S., Rost, H. L., Uszkoreit, J., Barsnes, H., Vaudel, M., Moreno, P., Gatto, L., Weber, J., Bai, M., Jimenez, R. C., Sachsenberg, T., Pfeuffer, J., Vera Alvarez, R., Griss, J., Nesvizhskii, A. I., &amp; Perez-Riverol, Y. (2017). BioContainers: an open-source and community-driven framework for software standardization. Bioinformatics, 33(16), 2580-2582. doi: <a href="https://doi.org/10.1093/bioinformatics/btx192">10.1093/bioinformatics/btx192</a></li>
    ${tool_bibliography}
  </ul>
